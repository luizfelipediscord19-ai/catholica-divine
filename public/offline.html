<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sem internet — Portal Católico</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: #0a0a0a;
        color: #f3efe6;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
      }
      main { max-width: 34rem; }
      .selo {
        font-size: 0.68rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #c9a44c;
      }
      h1 { font-size: 1.7rem; margin: 0.9rem 0 0.6rem; font-weight: 500; }
      p { margin: 0 0 1rem; line-height: 1.7; color: #b8b2a6; font-size: 0.95rem; }
      ul {
        list-style: none;
        padding: 0;
        margin: 1.5rem 0 0;
        display: grid;
        gap: 0.5rem;
      }
      a.link {
        display: block;
        padding: 0.7rem 1rem;
        border: 1px solid rgba(201, 164, 76, 0.35);
        color: #f3efe6;
        text-decoration: none;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
      }
      button {
        margin-top: 1.5rem;
        background: #c9a44c;
        color: #0a0a0a;
        border: 0;
        padding: 0.75rem 1.6rem;
        font: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="selo">Portal Católico</p>
      <h1>Você está sem internet</h1>
      <p>
        Esta página ainda não foi guardada no aparelho. As páginas e textos que você já
        abriu continuam disponíveis mesmo offline.
      </p>
      <ul>
        <li><a class="link" href="/">Início</a></li>
        <li><a class="link" href="/biblia">Bíblia</a></li>
        <li><a class="link" href="/oracoes">Orações</a></li>
        <li><a class="link" href="/painel">Painel espiritual</a></li>
      </ul>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
